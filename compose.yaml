services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - 5433:5432
    environment:
      POSTGRES_USER: pauta
      POSTGRES_PASSWORD: pauta
      POSTGRES_DB: pauta
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pauta -d pauta"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
